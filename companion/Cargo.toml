[package]
name = "setu-companion"
version = "1.1.0"
edition = "2021"
authors = ["Setu Team"]
description = "Lightweight Native Input Daemon for Setu Remote Control"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
enigo = { version = "0.2", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
